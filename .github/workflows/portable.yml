name: Портативная версия для Windows

# Собирает один .exe без установки. Запускается вручную (Actions → «Портативная
# версия для Windows» → Run workflow) и при пуше в рабочую ветку форка.
# Готовый файл — в разделе Artifacts внизу страницы запуска, а в приватном
# репозитории ещё и в Releases (релиз v<версия>-ru, файл перезаписывается).
on:
  workflow_dispatch:
  push:
    branches:
      - claude/confident-noether-cbuj2x

# Новый запуск отменяет незавершённый предыдущий на той же ветке.
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Ключи OAuth берутся из Settings → Secrets and variables → Actions.
      # Без них сборка пройдёт, но вход через Google/Microsoft не заработает
      # (IMAP с паролем приложения работает всегда).
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "yarn"

      - name: Check OAuth secrets
        shell: bash
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::warning::Секрет GOOGLE_CLIENT_ID не задан — вход через Google в этой сборке работать не будет."
          fi

      - name: Install dependencies
        run: yarn install

      - name: Install analysis dependencies
        run: yarn install
        working-directory: analysis

      - name: Build portable exe
        shell: bash
        run: |
          npx electron-rebuild -f -w better-sqlite3
          yarn build
          npx electron-builder --win portable --x64 --publish never \
            '-c.portable.artifactName=Paperweight-${version}-portable.exe'

      - name: Upload portable exe
        uses: actions/upload-artifact@v7
        with:
          name: paperweight-portable-windows
          path: dist/*-portable.exe
          archive: false

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Сборка с отключённой проверкой лицензии не должна лежать в публичном
      # доступе: релиз публикуется только из приватного репозитория.
      - name: Publish to Releases
        if: github.event.repository.private
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}-ru
          target_commitish: ${{ github.sha }}
          name: Paperweight ${{ steps.version.outputs.version }} — русская сборка
          body: |
            Портативная версия для Windows: один .exe без установки.
            Сборка из коммита ${{ github.sha }}.
          files: dist/*-portable.exe
          overwrite_files: true
          make_latest: true

      - name: Skip Releases in a public repository
        if: ${{ !github.event.repository.private }}
        shell: bash
        run: echo "::notice::Репозиторий публичный — релиз не публикуется. Сделайте репозиторий приватным, файл появится в Releases."
